<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sentra: real-time face recognition, entry/exit tracking and alerts for campuses." />
    <meta name="theme-color" content="#020617" />
    <title>Sentra · Campus Intelligence</title>
    <script>
      // Apply the saved theme before first paint so there's no light/dark flash.
      try {
        var t = localStorage.getItem('sentra_theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
